[package]
name = "tree-sitter-hydro"
description = "Parser for my programming language"
version = "0.0.1"
authors = ["Carson Bates (carsonetb) <me@carsonetb.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "hydro"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/carsonetb/tree-sitter-hydro"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.7"
